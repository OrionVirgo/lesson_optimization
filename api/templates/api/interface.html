<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Ders Programı Canlı Optimizasyon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f3f4f6; padding: 30px; }
        .dashboard-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
        th { background-color: #4f46e5; color: white; text-align: center; }
        td { height: 70px; vertical-align: middle; text-align: center; font-size: 0.85rem; }
        .schedule-item { background-color: #e0e7ff; border-left: 4px solid #4f46e5; border-radius: 4px; padding: 4px; }
        .schedule-item.lab { background-color: #fef3c7; border-left: 4px solid #d97706; }
        .empty-cell { color: #d1d5db; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark">🎯 Live Lesson Schedule Generator</h2>
        <button id="generateBtn" class="btn btn-primary btn-lg fw-bold shadow-sm">🚀 Generate Schedule</button>
    </div>

    <!-- Sonuçların Dinamik Olarak Geleceği Alan -->
    <div id="tablesContainer">
        <div class="alert alert-info text-center">Program not generated yet. Click the button above to create a new schedule.</div>
    </div>
</div>

<script>
document.getElementById('generateBtn').addEventListener('click', function() {
    const container = document.getElementById('tablesContainer');
    container.innerHTML = '<div class="text-center my-5"><div class="spinner-border text-primary" role="status"></div><p class="mt-2">Algoritma çalışıyor, kombinasyonlar optimize ediliyor...</p></div>';

    // Backend API'ne veritabanına yazmayan o POST isteğini atıyoruz
    fetch('/api/generate-schedule/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken') // Django güvenlik tokenı
        }
    })
    .then(response => response.json())
    .then(data => {
        if (!data.schedule) {
            container.innerHTML = `<div class="alert alert-danger text-center">❌ Hata: ${data.error || 'Program üretilemedi.'}</div>`;
            return;
        }

        container.innerHTML = ''; // Spinner'ı temizle
        
        // Gelen verideki benzersiz sınıfları ayırt edelim (Class A, Class B vb.)
        const classes = [...new Set(data.schedule.map(item => item.school_class))];
        const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
        const hours = [1, 2, 3, 4, 5, 6, 7, 8];

        classes.forEach(className => {
            let card = document.createElement('div');
            card.className = 'dashboard-card';
            
            let title = document.createElement('h4');
            title.className = 'fw-bold mb-3 text-indigo text-primary';
            title.innerText = `🏫 Class: ${className}`;
            card.appendChild(title);

            let tableResponsive = document.createElement('div');
            tableResponsive.className = 'table-responsive';

            let table = document.createElement('table');
            table.className = 'table table-bordered align-middle';

            // Tablo Başlığı (Günler)
            let thead = '<thead><tr><th style="width: 10%;">Saat / Gün</th>';
            days.forEach(day => { thead += `<th style="width: 18%;">${day}</th>`; });
            thead += '</tr></thead>';
            table.innerHTML += thead;

            // Tablo Gövdesi (Saatler)
            let tbody = '<tbody>';
            hours.forEach(hour => {
                tbody += `<tr><td class="fw-bold bg-light">${hour}. Ders</td>`;
                days.forEach(day => {
                    // O saat ve güne denk gelen dersi ara
                    const match = data.schedule.find(item => 
                        item.school_class === className && 
                        item.day === day && 
                        item.hour === hour
                    );

                    if (match) {
                        const isLab = match.course.toLowerCase().includes('program') || match.course.toLowerCase().includes('chem');
                        tbody += `<td>
                                    <div class="schedule-item ${isLab ? 'lab' : ''}">
                                        <strong class="text-dark">${match.course}</strong><br>
                                        <small class="text-muted">👤 ${match.teacher}</small><br>
                                        <span class="badge bg-secondary">📍 ${match.classroom}</span>
                                    </div>
                                  </td>`;
                    } else {
                        tbody += '<td><span class="empty-cell">-</span></td>';
                    }
                });
                tbody += '</tr>';
            });
            tbody += '</tbody>';
            table.innerHTML += tbody;
            
            tableResponsive.appendChild(table);
            card.appendChild(tableResponsive);
            container.appendChild(card);
        });
    })
    .catch(error => {
        container.innerHTML = `<div class="alert alert-danger text-center">Bağlantı Hatası: ${error}</div>`;
    });
});

// Django CSRF Token okuma fonksiyonu
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>

</body>
</html>
