<section id="sec-courses" class="hidden flex flex-col gap-8">
    <div class="flex flex-col gap-4">
        <div class="flex justify-between items-center">
            <div>
                <h2 class="text-xl font-display font-bold text-white">Course Definitions</h2>
                <p class="text-xs text-slate-400">Curriculum subjects and lab requirements</p>
            </div>
            <button onclick="openModal('modal-course')" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-sm font-semibold transition-all flex items-center gap-2">
                <i class="fa-solid fa-plus"></i>
                <span>Add Course</span>
            </button>
        </div>
        <div id="courses-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        </div>
    </div>

    <div class="flex flex-col gap-4">
        <div class="flex justify-between items-center">
            <div>
                <h2 class="text-xl font-display font-bold text-white">Course Assignments</h2>
                <p class="text-xs text-slate-400">Pair Class + Course + Teacher + Weekly Hours</p>
            </div>
            <button onclick="openModal('modal-requirement')" class="px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-semibold text-sm transition-all flex items-center gap-2 shadow-lg shadow-brand-500/20">
                <i class="fa-solid fa-plus"></i>
                <span>Assign Course</span>
            </button>
        </div>
        <div class="glass-card rounded-2xl overflow-hidden border border-slate-800">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-900/80 text-xs uppercase font-bold text-slate-400 border-b border-slate-800">
                    <tr>
                        <th class="py-3.5 px-6">Class</th>
                        <th class="py-3.5 px-6">Course</th>
                        <th class="py-3.5 px-6">Teacher</th>
                        <th class="py-3.5 px-6">Weekly Hours</th>
                        <th class="py-3.5 px-6 text-right">Action</th>
                    </tr>
                </thead>
                <tbody id="requirements-table-body" class="divide-y divide-slate-800 text-sm text-slate-300">
                </tbody>
            </table>
        </div>
    </div>
</section>
