            <p class="text-sm text-slate-400">Available period slots for scheduling</p>
        </div>
        <button onclick="generateDefaultTimeSlots()" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-sm font-semibold transition-all flex items-center gap-2">

    <div class="glass-card rounded-2xl overflow-hidden border border-slate-800 p-6">
