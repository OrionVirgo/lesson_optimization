{% verbatim %}
<section v-show="activeTab === 'timeslots'" class="flex flex-col gap-6">
    <div class="flex justify-between items-center">
        <div>
            <h2 class="text-2xl font-display font-bold text-white">{{ t('timeslots_mgmt_title') }}</h2>
            <p class="text-sm text-slate-400">{{ t('timeslots_mgmt_subtitle') }}</p>
        </div>
        <button @click="generateDefaultTimeSlots" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-sm font-semibold transition-all flex items-center gap-2">
            <i class="fa-solid fa-rotate-right text-brand-400"></i>
            <span>{{ t('generate_default_slots') }}</span>
        </button>
    </div>

    <div class="glass-card rounded-2xl overflow-hidden border border-slate-800 p-6">
        <div v-if="state.timeslots.length === 0" class="py-8 text-center text-slate-500 italic">
            {{ t('no_timeslots') }}
        </div>
        <div v-else class="grid grid-cols-1 sm:grid-cols-5 gap-6">
            <div v-for="day in dayKeys" :key="day" class="flex flex-col gap-3">
                <h4 class="font-display font-bold text-sm text-brand-400 uppercase tracking-wider border-b border-slate-800 pb-2 flex items-center justify-between">
                    <span>{{ t('day_' + day.toLowerCase()) }}</span>
                    <span class="text-xs text-slate-500 font-normal">({{ getTimeSlotsForDay(day).length }} {{ t('hour') }})</span>
                </h4>
                <div class="flex flex-col gap-2">
                    <div v-for="ts in getTimeSlotsForDay(day)" :key="ts.id"
                         class="p-2.5 rounded-xl bg-slate-900/80 border border-slate-800 flex items-center justify-between text-xs font-semibold text-slate-300">
                        <span class="flex items-center gap-2">
                            <i class="fa-regular fa-clock text-brand-400"></i>
                            <span>{{ t('hour_num', { num: ts.hour }) }}</span>
                        </span>
                        <span class="text-[10px] text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded">Aktif</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endverbatim %}
