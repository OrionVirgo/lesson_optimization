<div id="modal-teacher" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass-card rounded-2xl p-6 w-full max-w-md border border-slate-700 shadow-2xl flex flex-col gap-4">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-user-plus text-brand-400"></i> Add New Teacher
        </h3>
        <form onsubmit="handleSaveTeacher(event)" class="flex flex-col gap-3 text-sm">
            <label class="flex flex-col gap-1 text-slate-300 font-medium">
                Teacher Name:
                <input id="input-teacher-name" type="text" required placeholder="e.g. John Smith" class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
            </label>
            <label class="flex flex-col gap-1 text-slate-300 font-medium">
                Weekly Off-Day:
                <select id="select-teacher-offday" class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                </select>
            </label>
            <div class="flex justify-end gap-2 mt-2">
                <button type="button" onclick="closeModal('modal-teacher')" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold">Cancel</button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-sm font-semibold">Save</button>
            </div>
        </form>
    </div>
</div>

<div id="modal-classroom" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">

<div id="modal-requirement" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass-card rounded-2xl p-6 w-full max-w-md border border-slate-700 shadow-2xl flex flex-col gap-4">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-link text-brand-400"></i> Create Course Assignment
        </h3>
        <form onsubmit="handleSaveRequirement(event)" class="flex flex-col gap-3 text-sm">
            <label class="flex flex-col gap-1 text-slate-300 font-medium">
                Select Class:
                <select id="select-req-class" required class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
                </select>
            </label>
            <label class="flex flex-col gap-1 text-slate-300 font-medium">
                Select Course:
                <select id="select-req-course" required class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
                </select>
            </label>
            <label class="flex flex-col gap-1 text-slate-300 font-medium">
                Select Teacher:
                <select id="select-req-teacher" required class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
                </select>
            </label>
            <label class="flex flex-col gap-1 text-slate-300 font-medium">
                Weekly Hours:
                <input id="input-req-hours" type="number" min="1" max="10" value="2" required class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
            </label>
            <div class="flex justify-end gap-2 mt-2">
                <button type="button" onclick="closeModal('modal-requirement')" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold">Cancel</button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-sm font-semibold">Save</button>
            </div>
        </form>
    </div>
</div>
