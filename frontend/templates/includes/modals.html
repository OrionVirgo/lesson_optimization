{% verbatim %}
<div v-show="activeModal === 'teacher'" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass-card rounded-2xl p-6 w-full max-w-md border border-slate-700 shadow-2xl flex flex-col gap-4">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-user-plus text-brand-400"></i> Add New Teacher
        </h3>
        <form @submit.prevent="saveTeacher" class="flex flex-col gap-3 text-sm">
            <label class="flex flex-col gap-1 text-slate-300 font-medium">
                Teacher Name:
                <input v-model="formTeacher.name" type="text" required placeholder="e.g. John Smith" class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
            </label>
            <label class="flex flex-col gap-1 text-slate-300 font-medium">
                Weekly Off-Day:
                <select v-model="formTeacher.off_day" class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
                    <option v-for="day in dayKeys" :key="day" :value="day">{{ day }}</option>
                </select>
            </label>
            <div class="flex justify-end gap-2 mt-2">
                <button type="button" @click="closeModal" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold">Cancel</button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-sm font-semibold">Save</button>
            </div>
        </form>
    </div>
</div>

            <div class="flex justify-end gap-2 mt-2">

<div v-show="activeModal === 'classroom'" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass-card rounded-2xl p-6 w-full max-w-md border border-slate-700 shadow-2xl flex flex-col gap-4">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-door-open text-brand-400"></i> Add New Room / Laboratory
        </h3>
        <form @submit.prevent="saveClassroom" class="flex flex-col gap-3 text-sm">
            <label class="flex flex-col gap-1 text-slate-300 font-medium">
                Room Name:
                <input v-model="formClassroom.name" type="text" required placeholder="e.g. Room 101 or Science Lab" class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
            </label>
            <label class="flex items-center gap-3 text-slate-300 font-medium cursor-pointer mt-1">
                <input v-model="formClassroom.is_lab" type="checkbox" class="w-4 h-4 rounded text-brand-600 focus:ring-brand-500 bg-slate-900 border-slate-700">
                <span>Is Laboratory Facility?</span>
            </label>
            <div class="flex justify-end gap-2 mt-2">
                <button type="button" @click="closeModal" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold">Cancel</button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-sm font-semibold">Save</button>
            </div>
        </form>
    </div>
</div>

<div v-show="activeModal === 'course'" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass-card rounded-2xl p-6 w-full max-w-md border border-slate-700 shadow-2xl flex flex-col gap-4">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-book text-brand-400"></i> Add New Course
        </h3>
        <form @submit.prevent="saveCourse" class="flex flex-col gap-3 text-sm">
            <label class="flex flex-col gap-1 text-slate-300 font-medium">
                Course Name:
                <input v-model="formCourse.name" type="text" required placeholder="e.g. Mathematics" class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
            </label>
            <label class="flex items-center gap-3 text-slate-300 font-medium cursor-pointer mt-1">
                <input v-model="formCourse.is_lab_required" type="checkbox" class="w-4 h-4 rounded text-brand-600 focus:ring-brand-500 bg-slate-900 border-slate-700">
                <span>Laboratory Required?</span>
            </label>
            <div class="flex justify-end gap-2 mt-2">
                <button type="button" @click="closeModal" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold">Cancel</button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-sm font-semibold">Save</button>
            </div>
        </form>
    </div>
</div>

<div v-show="activeModal === 'requirement'" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass-card rounded-2xl p-6 w-full max-w-md border border-slate-700 shadow-2xl flex flex-col gap-4">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-link text-brand-400"></i> Create Course Assignment
        </h3>
        <form @submit.prevent="saveRequirement" class="flex flex-col gap-3 text-sm">
            <label class="flex flex-col gap-1 text-slate-300 font-medium">
                Select Class:
                <select v-model="formReq.school_class" required class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
                    <option v-for="c in state.classes" :key="c.id" :value="c.id">{{ c.name }}</option>
                </select>
            </label>
            <label class="flex flex-col gap-1 text-slate-300 font-medium">
                Select Course:
                <select v-model="formReq.course" required class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
                    <option v-for="co in state.courses" :key="co.id" :value="co.id">{{ co.name }}</option>
                </select>
            </label>
            <label class="flex flex-col gap-1 text-slate-300 font-medium">
                Select Teacher:
                <select v-model="formReq.teacher" required class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
                    <option v-for="t in state.teachers" :key="t.id" :value="t.id">{{ t.name }} (Off: {{ t.off_day }})</option>
                </select>
            </label>
            <label class="flex flex-col gap-1 text-slate-300 font-medium">
                Weekly Hours:
                <input v-model.number="formReq.weekly_hours" type="number" min="1" max="10" required class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
            </label>
            <div class="flex justify-end gap-2 mt-2">
                <button type="button" @click="closeModal" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold">Cancel</button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-sm font-semibold">Save</button>
            </div>
        </form>
    </div>
</div>
{% endverbatim %}
