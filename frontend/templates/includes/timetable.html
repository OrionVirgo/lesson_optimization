<section id="sec-timetable" class="flex flex-col gap-6">
    <div class="no-print glass-card p-4 rounded-2xl flex flex-wrap items-center justify-between gap-4 border border-slate-800">
        <div class="flex items-center gap-3 flex-wrap">
            <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Select Class:</span>
            <select id="filter-target" onchange="renderTimetable()" class="bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-xl px-4 py-2 focus:ring-2 focus:ring-brand-500 focus:outline-none font-semibold">
            </select>
        </div>

        <div id="schedule-stats-pill" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-brand-500/10 text-brand-400 border border-brand-500/20 flex items-center gap-2">
            <i class="fa-solid fa-circle-info"></i>
            <span id="stats-text">No schedule generated yet</span>
        </div>
    </div>

    <div class="glass-card rounded-2xl p-6 border border-slate-800 shadow-2xl overflow-hidden printable-grid">
        <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-4">
            <div>
                <h2 id="timetable-title" class="text-xl font-display font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-table-cells text-brand-400"></i>
                    <span>Weekly Schedule Matrix</span>
                </h2>
                <p id="timetable-subtitle" class="text-xs text-slate-400">Monday - Friday Weekly Overview</p>
            </div>
            <div class="flex items-center gap-4 text-xs">
                <span class="flex items-center gap-1.5 text-slate-300">
                    <span class="w-3 h-3 rounded-full bg-brand-500 inline-block"></span> Lecture
                </span>
                <span class="flex items-center gap-1.5 text-slate-300">
                    <span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span> Laboratory
                </span>
            </div>
        </div>

        <div class="overflow-x-auto custom-scrollbar">
            <table class="w-full border-collapse min-w-[700px] text-center">
                <thead>
                    <tr class="bg-slate-900/90 text-slate-300 text-sm font-bold border-b border-slate-800">
                        <th class="py-3 px-4 w-20 border-r border-slate-800">Hour</th>
                        <th class="py-3 px-4 w-1/5 border-r border-slate-800">Monday</th>
                        <th class="py-3 px-4 w-1/5 border-r border-slate-800">Tuesday</th>
                        <th class="py-3 px-4 w-1/5 border-r border-slate-800">Wednesday</th>
                        <th class="py-3 px-4 w-1/5 border-r border-slate-800">Thursday</th>
                        <th class="py-3 px-4 w-1/5">Friday</th>
                    </tr>
                </thead>
                <tbody id="timetable-body" class="divide-y divide-slate-800/60">
                </tbody>
            </table>
        </div>
    </div>
</section>
