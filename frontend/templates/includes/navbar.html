{% verbatim %}
<header class="no-print sticky top-0 z-40 glass-card border-b border-slate-800 bg-slate-950/80 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-brand-600 via-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-brand-500/30">
                <i class="fa-solid fa-calendar-days text-2xl text-white"></i>
            </div>
            <div>
                <h1 class="font-display font-bold text-xl tracking-tight text-white flex items-center gap-2">
                    {{ t('app_title') }} <span class="gradient-text font-extrabold">{{ t('app_title_highlight') }}</span>
                </h1>
                <p class="text-xs text-slate-400 font-medium">{{ t('app_subtitle') }}</p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <!-- Vue 3 Reactive Language Switcher -->
            <div class="flex items-center gap-1 bg-slate-900 border border-slate-800 p-1 rounded-xl">
                <button @click="setLanguage('tr')" 
                        :class="currentLang === 'tr' ? 'bg-brand-600 text-white font-bold shadow-md' : 'text-slate-400 hover:text-slate-200'"
                        class="px-2.5 py-1 rounded-lg text-xs transition-all flex items-center gap-1">
                    <span>🇹🇷</span> <span>TR</span>
                </button>
                <button @click="setLanguage('en')" 
                        :class="currentLang === 'en' ? 'bg-brand-600 text-white font-bold shadow-md' : 'text-slate-400 hover:text-slate-200'"
                        class="px-2.5 py-1 rounded-lg text-xs transition-all flex items-center gap-1">
                    <span>🇬🇧</span> <span>EN</span>
                </button>
            </div>

            <div v-if="user" class="hidden sm:flex items-center gap-2 px-3.5 py-2 rounded-xl bg-slate-900/90 border border-slate-800 text-slate-300 text-xs font-medium">
                <i class="fa-solid fa-circle-user text-brand-400 text-sm"></i>
                <span>{{ t('welcome') }} <strong class="text-white font-semibold">{{ user.username }}</strong></span>
            </div>
            <button @click="generateSchedule" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-brand-600 to-purple-600 hover:from-brand-500 hover:to-purple-500 text-white text-sm font-bold shadow-lg shadow-brand-500/25 hover:shadow-brand-500/40 transition-all flex items-center gap-2 transform active:scale-95">
                <i class="fa-solid fa-bolt"></i>
                <span>{{ t('generate_schedule') }}</span>
            </button>
            <button @click="printWindow" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 transition-all" :title="t('print_timetable')">
                <i class="fa-solid fa-print"></i>
            </button>
            <button @click="handleLogout" class="p-2.5 px-3.5 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/30 transition-all flex items-center gap-1.5 text-xs font-semibold" :title="t('log_out')">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span class="hidden md:inline">{{ t('log_out') }}</span>
            </button>
        </div>
    </div>
</header>
{% endverbatim %}
