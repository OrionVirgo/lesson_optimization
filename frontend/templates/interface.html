                extend: {
                    colors: {
                        brand: {

                }
            }
        }

    <style>
        [v-cloak] { display: none !important; }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glass-card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card-hover:hover {
            transform: translateY(-2px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 12px 40px 0 rgba(99, 102, 241, 0.2);
        }
        .gradient-text {
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.8);
        }
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: white !important;
                color: black !important;
            }
            .glass-card {
                background: white !important;
                border: 1px solid #ccc !important;
                box-shadow: none !important;
            }
            .printable-grid {
                color: black !important;
            }
        }
    </style>
</head>

    <div id="app" v-cloak class="min-h-screen flex flex-col">

            <div v-for="toast in toasts" :key="toast.id"
                 class="glass-card border p-4 rounded-xl shadow-xl flex items-center gap-3 text-sm font-semibold pointer-events-auto transition-all duration-300"
                 :class="{
                     'bg-emerald-900/90 border-emerald-500 text-emerald-200': toast.type === 'success',
                     'bg-rose-900/90 border-rose-500 text-rose-200': toast.type === 'error',
                     'bg-brand-900/90 border-brand-500 text-brand-200': toast.type === 'info'
                 }">
                <i class="fa-solid" :class="{
                    'fa-circle-check': toast.type === 'success',
                    'fa-circle-xmark': toast.type === 'error',
                    'fa-circle-info': toast.type === 'info'
                }"></i>
                <span>{{ toast.message }}</span>
            </div>
        </div>

                            isLoggedIn.value = true;
                            loadAllData();
                            return;
                        } catch (e) {
                            // If token is invalid or expired, clear local storage and show login modal
                            handleLogout(false);
                            return;
                        }
                    }
                    handleLogout(false);
                };

                // Automatic 401 Interceptor: Clear expired tokens if 401 occurs
                axios.interceptors.response.use(
                    response => response,
                    error => {
                        if (error.response && error.response.status === 401) {
                            handleLogout(false);
                        }
                        return Promise.reject(error);

                );

                    if (typeof data === 'object') {
                        const keys = Object.keys(data);
                        if (keys.length > 0) {
                            const field = keys[0];
                            const msg = Array.isArray(data[field]) ? data[field].join(', ') : data[field];
                            return `${field}: ${msg}`;

                const aiMessages = ref([

                const toggleAiChat = () => {

                    setTimeout(() => {
                        if (aiChatContainer.value) {
                            aiChatContainer.value.scrollTop = aiChatContainer.value.scrollHeight;
                        }
                    }, 50);
                };

                const formatAiMarkdown = (text) => {
                    if (!text) return '';
                    let formatted = text
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\*(.*?)\*/g, '<em>$1</em>')
                        .replace(/`([^`]+)`/g, '<code class="bg-purple-950/60 text-purple-300 px-1.5 py-0.5 rounded border border-purple-800/40 text-xs font-mono">$1</code>');
                    return formatted;
                };

                const sendAiSuggestion = (suggestionText) => {
                    aiInput.value = suggestionText;
                    sendAiMessage();

                const sendAiMessage = async () => {
                    const msg = aiInput.value ? aiInput.value.trim() : '';
                    if (!msg || aiLoading.value) return;

                    aiMessages.value.push({ role: 'user', text: msg });
                    aiInput.value = '';
                    aiLoading.value = true;
                    scrollAiChatToBottom();

                    try {
                        const historyForBackend = aiMessages.value.slice(-6).map(m => ({
                            role: m.role,
                            text: m.text
                        }));

                        const res = await axios.post(`${API_BASE}/ai/chat/`, {
                            message: msg,
                            history: historyForBackend
                        }, { headers: getAuthHeaders() });

                        aiMessages.value.push({
                            role: 'assistant',
                            text: res.data.reply || 'Yanıt alınamadı.'
                        });
                    } catch (err) {
                        const errorMsg = err.response?.data?.error || err.message || 'Sunucu ile bağlantı kurulamadı.';
                        aiMessages.value.push({
                            role: 'assistant',
                            text: `⚠️ **Hata**: ${errorMsg}`
                        });
                    } finally {
                        aiLoading.value = false;
                        scrollAiChatToBottom();
                    }
                };

                onMounted(() => {
                    checkAuth();
                });

                return {
                    isLoggedIn,
                    user,
                    activeTab,

                    toasts,
