<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Scheduling & Optimization System (Vue 3 Standalone)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#1e1b4b',
                        },
                        darkbg: '#0f172a',
                        darkcard: '#1e293b',
                        darkborder: '#334155'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        [v-cloak] { display: none !important; }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .gradient-text {
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

    <div id="app" v-cloak class="min-h-screen flex flex-col">

        <!-- Toast Notifications -->
        <div class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm pointer-events-none">
            <div v-for="toast in toasts" :key="toast.id"
                 class="glass-card border p-4 rounded-xl shadow-xl flex items-center gap-3 text-sm font-semibold pointer-events-auto"
                 :class="{
                     'bg-emerald-900/90 border-emerald-500 text-emerald-200': toast.type === 'success',
                     'bg-rose-900/90 border-rose-500 text-rose-200': toast.type === 'error',
                     'bg-brand-900/90 border-brand-500 text-brand-200': toast.type === 'info'
                 }">
                <i class="fa-solid" :class="{
                    'fa-circle-check': toast.type === 'success',
                    'fa-circle-xmark': toast.type === 'error',
                    'fa-circle-info': toast.type === 'info'
                }"></i>
                <span>{{ toast.message }}</span>
            </div>
        </div>

        <!-- LOGIN SECTION -->
        <div v-if="!isLoggedIn" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 backdrop-blur-xl p-4">
            <div class="glass-card max-w-md w-full rounded-3xl p-8 border border-slate-800 shadow-2xl flex flex-col gap-6">
                <div class="text-center flex flex-col items-center gap-3">
                    <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-600 via-indigo-500 to-purple-500 flex items-center justify-center shadow-xl">
                        <i class="fa-solid fa-user-lock text-3xl text-white"></i>
                    </div>
                    <div>
                        <h2 class="font-display font-bold text-2xl text-white tracking-tight">Vue 3 Frontend</h2>
                        <p class="text-xs text-slate-400 mt-1">Log in to Lesson Optimization System</p>
                    </div>
                </div>

                <form @submit.prevent="handleLogin" class="flex flex-col gap-4">
                    <div v-if="loginError" class="p-3 rounded-xl bg-rose-950/80 border border-rose-500/50 text-rose-300 text-xs font-semibold flex items-center gap-2">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span>{{ loginError }}</span>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Username</label>
                        <input v-model="loginForm.username" type="text" required placeholder="Username" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl py-3 px-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 font-medium">
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Password</label>
                        <input v-model="loginForm.password" type="password" required placeholder="Password" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl py-3 px-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 font-medium">
                    </div>

                    <button type="submit" class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-brand-600 to-purple-600 hover:from-brand-500 hover:to-purple-500 text-white font-bold text-sm shadow-lg">
                        Log In
                    </button>
                </form>
            </div>
        </div>

        <!-- MAIN APP -->
        <template v-else>
            <header class="sticky top-0 z-40 glass-card border-b border-slate-800 bg-slate-950/80 backdrop-blur-md">
                <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-brand-600 to-purple-500 flex items-center justify-center">
                            <i class="fa-solid fa-calendar-days text-2xl text-white"></i>
                        </div>
                        <div>
                            <h1 class="font-display font-bold text-xl text-white">
                                Vue 3 <span class="gradient-text font-extrabold">Frontend</span>
                            </h1>
                            <p class="text-xs text-slate-400">Lesson Optimization System</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-slate-300">User: <strong class="text-white">{{ user?.username }}</strong></span>
                        <button @click="handleLogout" class="p-2 px-3 rounded-xl bg-rose-500/10 text-rose-300 text-xs font-semibold">Log Out</button>
                    </div>
                </div>
            </header>

            <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
                <div class="glass-card p-6 rounded-2xl border border-slate-800 text-center">
                    <h2 class="text-xl font-bold text-white mb-2">Vue 3 Standalone App Operational</h2>
                    <p class="text-sm text-slate-400">Integrated with Django API Backend at {{ apiBase }}</p>
                </div>
            </main>
        </template>

    </div>

    <script>
        const { createApp, ref, reactive, onMounted } = Vue;

        createApp({
            setup() {
                const apiBase = ref('/api');
                const isLoggedIn = ref(false);
                const user = ref(null);
                const loginForm = reactive({ username: '', password: '' });
                const loginError = ref('');
                const toasts = ref([]);

                const showToast = (message, type = 'info') => {
                    const id = Date.now();
                    toasts.value.push({ id, message, type });
                    setTimeout(() => toasts.value = toasts.value.filter(t => t.id !== id), 4000);
                };

                const handleLogin = async () => {
                    loginError.value = '';
                    try {
                        const res = await fetch(`${apiBase.value}/auth/login/`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(loginForm)
                        });
                        const data = await res.json();
                        if (res.ok) {
                            localStorage.setItem('access_token', data.access);
                            isLoggedIn.value = true;
                            user.value = data.user;
                            showToast('Logged in successfully', 'success');
                        } else {
                            loginError.value = data.error || 'Login failed.';
                        }
                    } catch (e) {
                        loginError.value = 'Failed to connect to authentication server.';
                    }
                };

                const handleLogout = () => {
                    localStorage.removeItem('access_token');
                    isLoggedIn.value = false;
                    user.value = null;
                };

                return { apiBase, isLoggedIn, user, loginForm, loginError, toasts, handleLogin, handleLogout };
            }
        }).mount('#app');
    </script>
</body>
</html>
