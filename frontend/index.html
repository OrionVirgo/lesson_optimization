<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Scheduling & Optimization System (Vue 3)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#1e1b4b',
                        },
                        darkbg: '#0f172a',
                        darkcard: '#1e293b',
                        darkborder: '#334155'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        [v-cloak] { display: none !important; }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .gradient-text {
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 4px;
        }
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .glass-card { background: white !important; border: 1px solid #ccc !important; box-shadow: none !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

    <div id="app" v-cloak class="min-h-screen flex flex-col">

        <!-- Toasts -->
        <div class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm pointer-events-none">
            <div v-for="toast in toasts" :key="toast.id"
                 class="glass-card border p-4 rounded-xl shadow-xl flex items-center gap-3 text-sm font-semibold pointer-events-auto transition-all duration-300"
                 :class="{
                     'bg-emerald-900/90 border-emerald-500 text-emerald-200': toast.type === 'success',
                     'bg-rose-900/90 border-rose-500 text-rose-200': toast.type === 'error',
                     'bg-brand-900/90 border-brand-500 text-brand-200': toast.type === 'info'
                 }">
                <i class="fa-solid" :class="{
                    'fa-circle-check': toast.type === 'success',
                    'fa-circle-xmark': toast.type === 'error',
                    'fa-circle-info': toast.type === 'info'
                }"></i>
                <span>{{ toast.message }}</span>
            </div>
        </div>

        <!-- Authentication View -->
        <div v-if="!isLoggedIn" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 backdrop-blur-xl p-4">
            <div class="glass-card max-w-md w-full rounded-3xl p-8 border border-slate-800 shadow-2xl flex flex-col gap-6 relative overflow-hidden">
                <div class="text-center flex flex-col items-center gap-3">
                    <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-600 via-indigo-500 to-purple-500 flex items-center justify-center shadow-xl">
                        <i class="fa-solid fa-user-lock text-3xl text-white"></i>
                    </div>
                    <div>
                        <h2 class="font-display font-bold text-2xl text-white tracking-tight">User Authentication</h2>
                        <p class="text-xs text-slate-400 mt-1">Lesson Scheduling & Optimization System</p>
                    </div>
                </div>

                <form @submit.prevent="handleLogin" class="flex flex-col gap-4">
                    <div v-if="loginError" class="p-3 rounded-xl bg-rose-950/80 border border-rose-500/50 text-rose-300 text-xs font-semibold flex items-center gap-2">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span>{{ loginError }}</span>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Username</label>
                        <input v-model="loginForm.username" type="text" required placeholder="Enter username" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl py-3 px-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 font-medium">
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Password</label>
                        <input v-model="loginForm.password" type="password" required placeholder="Enter password" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl py-3 px-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 font-medium">
                    </div>

                    <button type="submit" class="mt-2 w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-brand-600 to-purple-600 hover:from-brand-500 hover:to-purple-500 text-white font-bold text-sm shadow-lg">
                        <span>Log In</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- Main Workspace -->
        <template v-else>
            <header class="no-print sticky top-0 z-40 glass-card border-b border-slate-800 bg-slate-950/80 backdrop-blur-md">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-brand-600 via-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-brand-500/30">
                            <i class="fa-solid fa-calendar-days text-2xl text-white"></i>
                        </div>
                        <div>
                            <h1 class="font-display font-bold text-xl tracking-tight text-white flex items-center gap-2">
                                Schedule <span class="gradient-text font-extrabold">Optimization</span>
                            </h1>
                            <p class="text-xs text-slate-400 font-medium">Intelligent Conflict-Free Timetable Generator</p>
                        </div>
                    </div>

                    <div class="flex items-center gap-3">
                        <div v-if="user" class="hidden sm:flex items-center gap-2 px-3.5 py-2 rounded-xl bg-slate-900/90 border border-slate-800 text-slate-300 text-xs font-medium">
                            <i class="fa-solid fa-circle-user text-brand-400 text-sm"></i>
                            <span>Welcome, <strong class="text-white font-semibold">{{ user.username }}</strong></span>
                        </div>
                        <button @click="generateSchedule" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-brand-600 to-purple-600 hover:from-brand-500 hover:to-purple-500 text-white text-sm font-bold shadow-lg shadow-brand-500/25 hover:shadow-brand-500/40 transition-all flex items-center gap-2 transform active:scale-95">
                            <i class="fa-solid fa-bolt"></i>
                            <span>Generate Schedule</span>
                        </button>
                        <button @click="printWindow" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 transition-all" title="Print Timetable">
                            <i class="fa-solid fa-print"></i>
                        </button>
                        <button @click="handleLogout" class="p-2.5 px-3.5 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/30 transition-all flex items-center gap-1.5 text-xs font-semibold" title="Log Out">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            <span class="hidden md:inline">Log Out</span>
                        </button>
                    </div>
                </div>
            </header>

            <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col gap-8">
                <!-- Navigation Tabs -->
                <div class="no-print glass-card p-1.5 rounded-2xl flex flex-wrap gap-1 border border-slate-800 bg-slate-900/60">
                    <button @click="activeTab = 'timetable'" :class="tabBtnClass('timetable')">
                        <i class="fa-solid fa-calendar-week"></i>
                        <span>Weekly Schedule</span>
                    </button>
                    <button @click="activeTab = 'teachers'" :class="tabBtnClass('teachers')">
                        <i class="fa-solid fa-chalkboard-user"></i>
                        <span>Teachers</span>
                    </button>
                    <button @click="activeTab = 'classes'" :class="tabBtnClass('classes')">
                        <i class="fa-solid fa-school"></i>
                        <span>Classes & Rooms</span>
                    </button>
                    <button @click="activeTab = 'courses'" :class="tabBtnClass('courses')">
                        <i class="fa-solid fa-book-open"></i>
                        <span>Courses & Assignments</span>
                    </button>
                    <button @click="activeTab = 'timeslots'" :class="tabBtnClass('timeslots')">
                        <i class="fa-solid fa-clock"></i>
                        <span>Time Slots</span>
                    </button>
                </div>

                <!-- Tab 1: Timetable Matrix -->
                <section v-show="activeTab === 'timetable'" class="flex flex-col gap-6">
                    <div class="no-print glass-card p-4 rounded-2xl flex flex-wrap items-center justify-between gap-4 border border-slate-800">
                        <div class="flex items-center gap-3 flex-wrap">
                            <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Select Class:</span>
                            <select v-model="filterTargetClass" class="bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-xl px-4 py-2 focus:ring-2 focus:ring-brand-500 focus:outline-none font-semibold">
                                <option v-for="c in state.classes" :key="c.id" :value="c.name">{{ c.name }}</option>
                            </select>
                        </div>
                        <div class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-brand-500/10 text-brand-400 border border-brand-500/20 flex items-center gap-2">
                            <i class="fa-solid fa-circle-info"></i>
                            <span>{{ scheduleStatsText }}</span>
                        </div>
                    </div>

                    <div class="glass-card rounded-2xl p-6 border border-slate-800 shadow-2xl overflow-hidden printable-grid">
                        <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-4">
                            <div>
                                <h2 class="text-xl font-display font-bold text-white flex items-center gap-2">
                                    <i class="fa-solid fa-table-cells text-brand-400"></i>
                                    <span>Weekly Schedule Matrix</span>
                                    <span v-if="filterTargetClass" class="text-brand-400 font-extrabold">({{ filterTargetClass }})</span>
                                </h2>
                                <p class="text-xs text-slate-400">Monday - Friday Weekly Overview</p>
                            </div>
                            <div class="flex items-center gap-4 text-xs">
                                <span class="flex items-center gap-1.5 text-slate-300">
                                    <span class="w-3 h-3 rounded-full bg-brand-500 inline-block"></span> Lecture
                                </span>
                                <span class="flex items-center gap-1.5 text-slate-300">
                                    <span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span> Laboratory
                                </span>
                            </div>
                        </div>

                        <div class="overflow-x-auto custom-scrollbar">
                            <table class="w-full border-collapse min-w-[700px] text-center">
                                <thead>
                                    <tr class="bg-slate-900/90 text-slate-300 text-sm font-bold border-b border-slate-800">
                                        <th class="py-3 px-4 w-20 border-r border-slate-800">Hour</th>
                                        <th v-for="day in dayKeys" :key="day" class="py-3 px-4 w-1/5 border-r border-slate-800">{{ day }}</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800/60 text-sm">
                                    <tr v-for="h in 8" :key="h" class="hover:bg-slate-900/40 transition-colors">
                                        <td class="py-4 px-3 font-semibold text-slate-400 bg-slate-950/40 border-r border-slate-800">Hour {{ h }}</td>
                                        <td v-for="day in dayKeys" :key="day" class="p-2 border-r border-slate-800/80 align-top">
                                            <div v-if="getScheduleSlot(filterTargetClass, day, h)"
                                                 class="p-3 rounded-xl border flex flex-col gap-1 shadow-md text-left transition-all duration-200 hover:scale-[1.02]"
                                                 :class="getScheduleSlot(filterTargetClass, day, h).is_lab ? 'bg-amber-950/40 border-amber-500/40 text-amber-200' : 'bg-brand-950/40 border-brand-500/40 text-brand-200'">
                                                <div class="font-bold text-sm tracking-wide flex items-center justify-between">
                                                    <span>{{ getScheduleSlot(filterTargetClass, day, h).course_name }}</span>
                                                    <i class="fa-solid text-xs" :class="getScheduleSlot(filterTargetClass, day, h).is_lab ? 'fa-flask text-amber-400' : 'fa-book text-brand-400'"></i>
                                                </div>
                                                <div class="text-xs opacity-90 flex items-center gap-1 mt-0.5">
                                                    <i class="fa-solid fa-chalkboard-user"></i>
                                                    <span>{{ getScheduleSlot(filterTargetClass, day, h).teacher_name }}</span>
                                                </div>
                                                <div class="text-[11px] opacity-75 flex items-center gap-1">
                                                    <i class="fa-solid fa-door-open"></i>
                                                    <span>{{ getScheduleSlot(filterTargetClass, day, h).classroom_name }}</span>
                                                </div>
                                            </div>
                                            <div v-else class="h-16 rounded-xl border border-dashed border-slate-800/80 flex items-center justify-center text-slate-600 text-xs font-medium">
                                                <span>Empty</span>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <!-- Tab 2: Teachers -->
                <section v-show="activeTab === 'teachers'" class="flex flex-col gap-6">
                    <div class="flex justify-between items-center">
                        <div>
                            <h2 class="text-2xl font-display font-bold text-white">Teacher Management</h2>
                            <p class="text-sm text-slate-400">Manage teaching staff and weekly off-days</p>
                        </div>
                        <button @click="openModal('teacher')" class="px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-semibold text-sm transition-all flex items-center gap-2 shadow-lg shadow-brand-500/20">
                            <i class="fa-solid fa-plus"></i>
                            <span>Add New Teacher</span>
                        </button>
                    </div>

                    <div class="glass-card rounded-2xl overflow-hidden border border-slate-800">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-slate-900/80 text-xs uppercase font-bold text-slate-400 border-b border-slate-800">
                                <tr>
                                    <th class="py-3.5 px-6">ID</th>
                                    <th class="py-3.5 px-6">Teacher Name</th>
                                    <th class="py-3.5 px-6">Off-Day</th>
                                    <th class="py-3.5 px-6 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800 text-sm text-slate-300">
                                <tr v-if="state.teachers.length === 0">
                                    <td colspan="4" class="py-8 text-center text-slate-500 italic">No teachers added yet.</td>
                                </tr>
                                <tr v-for="(teacher, index) in state.teachers" :key="teacher.id" class="hover:bg-slate-800/30 transition-colors">
                                    <td class="py-3.5 px-6 font-mono text-xs text-slate-500">#{{ index + 1 }}</td>
                                    <td class="py-3.5 px-6 font-semibold text-white flex items-center gap-2">
                                        <i class="fa-solid fa-user text-brand-400"></i>
                                        <span>{{ teacher.name }}</span>
                                    </td>
                                    <td class="py-3.5 px-6">
                                        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/10 text-indigo-300 border border-indigo-500/20">
                                            {{ teacher.off_day }}
                                        </span>
                                    </td>
                                    <td class="py-3.5 px-6 text-right">
                                        <button @click="deleteItem('teachers', teacher.id)" class="px-3 py-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/20 text-xs font-semibold transition-all flex items-center gap-1.5 ml-auto">
                                            <i class="fa-solid fa-trash-can"></i>
                                            <span>Delete</span>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- Tab 3: Classes & Classrooms -->
                <section v-show="activeTab === 'classes'" class="flex flex-col gap-8">
                    <div class="flex flex-col gap-4">
                        <div class="flex justify-between items-center">
                            <div>
                                <h2 class="text-xl font-display font-bold text-white">Classes</h2>
                                <p class="text-xs text-slate-400">Active student classes (e.g. Grade 9-A)</p>
                            </div>
                            <button @click="openModal('class')" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-sm font-semibold transition-all flex items-center gap-2">
                                <i class="fa-solid fa-plus"></i>
                                <span>Add Class</span>
                            </button>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                            <div v-if="state.classes.length === 0" class="col-span-full py-8 text-center text-slate-500 italic border border-dashed border-slate-800 rounded-2xl">
                                No student classes defined.
                            </div>
                            <div v-for="c in state.classes" :key="c.id" class="glass-card p-4 rounded-2xl border border-slate-800 flex items-center justify-between shadow-lg">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-brand-500/20 text-brand-400 flex items-center justify-center font-bold">
                                        <i class="fa-solid fa-users"></i>
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-white text-base">{{ c.name }}</h4>
                                        <p class="text-[11px] text-slate-400">Student Class</p>
                                    </div>
                                </div>
                                <button @click="deleteItem('school-classes', c.id)" class="p-2 rounded-lg text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 transition-all">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col gap-4">
                        <div class="flex justify-between items-center">
                            <div>
                                <h2 class="text-xl font-display font-bold text-white">Classrooms & Laboratories</h2>
                                <p class="text-xs text-slate-400">Physical rooms and laboratory facilities</p>
                            </div>
                            <button @click="openModal('classroom')" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-sm font-semibold transition-all flex items-center gap-2">
                                <i class="fa-solid fa-plus"></i>
                                <span>Add Classroom</span>
                            </button>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                            <div v-if="state.classrooms.length === 0" class="col-span-full py-8 text-center text-slate-500 italic border border-dashed border-slate-800 rounded-2xl">
                                No rooms or laboratories added.
                            </div>
                            <div v-for="cr in state.classrooms" :key="cr.id" class="glass-card p-4 rounded-2xl border border-slate-800 flex items-center justify-between shadow-lg">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl flex items-center justify-center font-bold"
                                         :class="cr.is_lab ? 'bg-amber-500/20 text-amber-400' : 'bg-indigo-500/20 text-indigo-400'">
                                        <i class="fa-solid" :class="cr.is_lab ? 'fa-flask' : 'fa-door-open'"></i>
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-white text-base">{{ cr.name }}</h4>
                                        <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md"
                                              :class="cr.is_lab ? 'bg-amber-500/10 text-amber-300 border border-amber-500/20' : 'bg-slate-800 text-slate-400'">
                                            {{ cr.is_lab ? 'Laboratory' : 'Standard Room' }}
                                        </span>
                                    </div>
                                </div>
                                <button @click="deleteItem('classrooms', cr.id)" class="p-2 rounded-lg text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 transition-all">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Tab 4: Courses & Assignments -->
                <section v-show="activeTab === 'courses'" class="flex flex-col gap-8">
                    <div class="flex flex-col gap-4">
                        <div class="flex justify-between items-center">
                            <div>
                                <h2 class="text-xl font-display font-bold text-white">Course Definitions</h2>
                                <p class="text-xs text-slate-400">Curriculum subjects and lab requirements</p>
                            </div>
                            <button @click="openModal('course')" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-sm font-semibold transition-all flex items-center gap-2">
                                <i class="fa-solid fa-plus"></i>
                                <span>Add Course</span>
                            </button>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                            <div v-if="state.courses.length === 0" class="col-span-full py-8 text-center text-slate-500 italic border border-dashed border-slate-800 rounded-2xl">
                                No courses defined.
                            </div>
                            <div v-for="course in state.courses" :key="course.id" class="glass-card p-4 rounded-2xl border border-slate-800 flex items-center justify-between shadow-lg">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center font-bold">
                                        <i class="fa-solid fa-book-open"></i>
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-white text-base">{{ course.name }}</h4>
                                        <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md"
                                              :class="course.is_lab_required ? 'bg-amber-500/10 text-amber-300 border border-amber-500/20' : 'bg-slate-800 text-slate-400'">
                                            {{ course.is_lab_required ? 'Lab Required' : 'Standard Classroom' }}
                                        </span>
                                    </div>
                                </div>
                                <button @click="deleteItem('courses', course.id)" class="p-2 rounded-lg text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 transition-all">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col gap-4">
                        <div class="flex justify-between items-center">
                            <div>
                                <h2 class="text-xl font-display font-bold text-white">Course Assignments</h2>
                                <p class="text-xs text-slate-400">Pair Class + Course + Teacher + Weekly Hours</p>
                            </div>
                            <button @click="openModal('requirement')" class="px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-semibold text-sm transition-all flex items-center gap-2 shadow-lg shadow-brand-500/20">
                                <i class="fa-solid fa-plus"></i>
                                <span>Assign Course</span>
                            </button>
                        </div>
                        <div class="glass-card rounded-2xl overflow-hidden border border-slate-800">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-slate-900/80 text-xs uppercase font-bold text-slate-400 border-b border-slate-800">
                                    <tr>
                                        <th class="py-3.5 px-6">Class</th>
                                        <th class="py-3.5 px-6">Course</th>
                                        <th class="py-3.5 px-6">Teacher</th>
                                        <th class="py-3.5 px-6">Weekly Hours</th>
                                        <th class="py-3.5 px-6 text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800 text-sm text-slate-300">
                                    <tr v-if="state.requirements.length === 0">
                                        <td colspan="5" class="py-8 text-center text-slate-500 italic">No course assignments added yet.</td>
                                    </tr>
                                    <tr v-for="req in state.requirements" :key="req.id" class="hover:bg-slate-800/30 transition-colors">
                                        <td class="py-3.5 px-6 font-bold text-white">{{ req.school_class_name }}</td>
                                        <td class="py-3.5 px-6 font-semibold text-brand-300">{{ req.course_name }}</td>
                                        <td class="py-3.5 px-6 text-slate-300">{{ req.teacher_name }}</td>
                                        <td class="py-3.5 px-6">
                                            <span class="px-2.5 py-1 rounded-md text-xs font-bold bg-slate-800 border border-slate-700 text-slate-200">
                                                {{ req.weekly_hours }} hrs / week
                                            </span>
                                        </td>
                                        <td class="py-3.5 px-6 text-right">
                                            <button @click="deleteItem('course-requirements', req.id)" class="px-3 py-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/20 text-xs font-semibold transition-all flex items-center gap-1.5 ml-auto">
                                                <i class="fa-solid fa-trash-can"></i>
                                                <span>Delete</span>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <!-- Tab 5: Time Slots -->
                <section v-show="activeTab === 'timeslots'" class="flex flex-col gap-6">
                    <div class="flex justify-between items-center">
                        <div>
                            <h2 class="text-2xl font-display font-bold text-white">Weekly Time Slots</h2>
                            <p class="text-sm text-slate-400">Available period slots for scheduling</p>
                        </div>
                        <button @click="generateDefaultTimeSlots" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-sm font-semibold transition-all flex items-center gap-2">
                            <i class="fa-solid fa-rotate-right text-brand-400"></i>
                            <span>Generate Default Slots (40 Slots)</span>
                        </button>
                    </div>

                    <div class="glass-card rounded-2xl overflow-hidden border border-slate-800 p-6">
                        <div v-if="state.timeslots.length === 0" class="py-8 text-center text-slate-500 italic">
                            No time slots configured. Click "Generate Default Slots" to create Monday-Friday (8 hours/day).
                        </div>
                        <div v-else class="grid grid-cols-1 sm:grid-cols-5 gap-6">
                            <div v-for="day in dayKeys" :key="day" class="flex flex-col gap-3">
                                <h4 class="font-display font-bold text-sm text-brand-400 uppercase tracking-wider border-b border-slate-800 pb-2 flex items-center justify-between">
                                    <span>{{ day }}</span>
                                    <span class="text-xs text-slate-500 font-normal">({{ getTimeSlotsForDay(day).length }} hrs)</span>
                                </h4>
                                <div class="flex flex-col gap-2">
                                    <div v-for="ts in getTimeSlotsForDay(day)" :key="ts.id"
                                         class="p-2.5 rounded-xl bg-slate-900/80 border border-slate-800 flex items-center justify-between text-xs font-semibold text-slate-300">
                                        <span class="flex items-center gap-2">
                                            <i class="fa-regular fa-clock text-brand-400"></i>
                                            <span>Hour {{ ts.hour }}</span>
                                        </span>
                                        <span class="text-[10px] text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded">Active</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </main>

            <!-- Modals -->
            <div v-show="activeModal === 'teacher'" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
                <div class="glass-card rounded-2xl p-6 w-full max-w-md border border-slate-700 shadow-2xl flex flex-col gap-4">
                    <h3 class="text-lg font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-user-plus text-brand-400"></i> Add New Teacher
                    </h3>
                    <form @submit.prevent="saveTeacher" class="flex flex-col gap-3 text-sm">
                        <label class="flex flex-col gap-1 text-slate-300 font-medium">
                            Teacher Name:
                            <input v-model="formTeacher.name" type="text" required placeholder="e.g. John Smith" class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
                        </label>
                        <label class="flex flex-col gap-1 text-slate-300 font-medium">
                            Weekly Off-Day:
                            <select v-model="formTeacher.off_day" class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
                                <option v-for="day in dayKeys" :key="day" :value="day">{{ day }}</option>
                            </select>
                        </label>
                        <div class="flex justify-end gap-2 mt-2">
                            <button type="button" @click="closeModal" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold">Cancel</button>
                            <button type="submit" class="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-sm font-semibold">Save</button>
                        </div>
                    </form>
                </div>
            </div>

            <div v-show="activeModal === 'class'" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
                <div class="glass-card rounded-2xl p-6 w-full max-w-md border border-slate-700 shadow-2xl flex flex-col gap-4">
                    <h3 class="text-lg font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-school text-brand-400"></i> Add New Class
                    </h3>
                    <form @submit.prevent="saveClass" class="flex flex-col gap-3 text-sm">
                        <label class="flex flex-col gap-1 text-slate-300 font-medium">
                            Class Name:
                            <input v-model="formClass.name" type="text" required placeholder="e.g. Grade 9-A" class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
                        </label>
                        <div class="flex justify-end gap-2 mt-2">
                            <button type="button" @click="closeModal" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold">Cancel</button>
                            <button type="submit" class="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-sm font-semibold">Save</button>
                        </div>
                    </form>
                </div>
            </div>

            <div v-show="activeModal === 'classroom'" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
                <div class="glass-card rounded-2xl p-6 w-full max-w-md border border-slate-700 shadow-2xl flex flex-col gap-4">
                    <h3 class="text-lg font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-door-open text-brand-400"></i> Add New Room / Laboratory
                    </h3>
                    <form @submit.prevent="saveClassroom" class="flex flex-col gap-3 text-sm">
                        <label class="flex flex-col gap-1 text-slate-300 font-medium">
                            Room Name:
                            <input v-model="formClassroom.name" type="text" required placeholder="e.g. Room 101 or Science Lab" class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
                        </label>
                        <label class="flex items-center gap-3 text-slate-300 font-medium cursor-pointer mt-1">
                            <input v-model="formClassroom.is_lab" type="checkbox" class="w-4 h-4 rounded text-brand-600 focus:ring-brand-500 bg-slate-900 border-slate-700">
                            <span>Is Laboratory Facility?</span>
                        </label>
                        <div class="flex justify-end gap-2 mt-2">
                            <button type="button" @click="closeModal" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold">Cancel</button>
                            <button type="submit" class="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-sm font-semibold">Save</button>
                        </div>
                    </form>
                </div>
            </div>

            <div v-show="activeModal === 'course'" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
                <div class="glass-card rounded-2xl p-6 w-full max-w-md border border-slate-700 shadow-2xl flex flex-col gap-4">
                    <h3 class="text-lg font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-book text-brand-400"></i> Add New Course
                    </h3>
                    <form @submit.prevent="saveCourse" class="flex flex-col gap-3 text-sm">
                        <label class="flex flex-col gap-1 text-slate-300 font-medium">
                            Course Name:
                            <input v-model="formCourse.name" type="text" required placeholder="e.g. Mathematics" class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
                        </label>
                        <label class="flex items-center gap-3 text-slate-300 font-medium cursor-pointer mt-1">
                            <input v-model="formCourse.is_lab_required" type="checkbox" class="w-4 h-4 rounded text-brand-600 focus:ring-brand-500 bg-slate-900 border-slate-700">
                            <span>Laboratory Required?</span>
                        </label>
                        <div class="flex justify-end gap-2 mt-2">
                            <button type="button" @click="closeModal" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold">Cancel</button>
                            <button type="submit" class="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-sm font-semibold">Save</button>
                        </div>
                    </form>
                </div>
            </div>

            <div v-show="activeModal === 'requirement'" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
                <div class="glass-card rounded-2xl p-6 w-full max-w-md border border-slate-700 shadow-2xl flex flex-col gap-4">
                    <h3 class="text-lg font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-link text-brand-400"></i> Create Course Assignment
                    </h3>
                    <form @submit.prevent="saveRequirement" class="flex flex-col gap-3 text-sm">
                        <label class="flex flex-col gap-1 text-slate-300 font-medium">
                            Select Class:
                            <select v-model="formReq.school_class" required class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
                                <option v-for="c in state.classes" :key="c.id" :value="c.id">{{ c.name }}</option>
                            </select>
                        </label>
                        <label class="flex flex-col gap-1 text-slate-300 font-medium">
                            Select Course:
                            <select v-model="formReq.course" required class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
                                <option v-for="co in state.courses" :key="co.id" :value="co.id">{{ co.name }}</option>
                            </select>
                        </label>
                        <label class="flex flex-col gap-1 text-slate-300 font-medium">
                            Select Teacher:
                            <select v-model="formReq.teacher" required class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
                                <option v-for="t in state.teachers" :key="t.id" :value="t.id">{{ t.name }} (Off: {{ t.off_day }})</option>
                            </select>
                        </label>
                        <label class="flex flex-col gap-1 text-slate-300 font-medium">
                            Weekly Hours:
                            <input v-model.number="formReq.weekly_hours" type="number" min="1" max="10" required class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-brand-500">
                        </label>
                        <div class="flex justify-end gap-2 mt-2">
                            <button type="button" @click="closeModal" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold">Cancel</button>
                            <button type="submit" class="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-sm font-semibold">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </template>
    </div>

    <script>
        const { createApp, ref, reactive, computed, onMounted } = Vue;

        createApp({
            setup() {
                const API_BASE = '/api';
                const dayKeys = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];

                const isLoggedIn = ref(false);
                const user = ref(null);
                const activeTab = ref('timetable');
                const activeModal = ref(null);
                const filterTargetClass = ref('');
                const toasts = ref([]);

                const loginForm = reactive({ username: '', password: '' });
                const loginError = ref('');

                const state = reactive({
                    teachers: [],
                    classes: [],
                    classrooms: [],
                    courses: [],
                    requirements: [],
                    timeslots: [],
                    schedules: []
                });

                const formTeacher = reactive({ name: '', off_day: 'Monday' });
                const formClass = reactive({ name: '' });
                const formClassroom = reactive({ name: '', is_lab: false });
                const formCourse = reactive({ name: '', is_lab_required: false });
                const formReq = reactive({ school_class: '', course: '', teacher: '', weekly_hours: 2 });

                const getAuthHeaders = (extra = {}) => {
                    const token = localStorage.getItem('access_token');
                    const headers = { ...extra };
                    if (token) headers['Authorization'] = `Bearer ${token}`;
                    return headers;
                };

                const showToast = (message, type = 'info') => {
                    const id = Date.now() + Math.random();
                    toasts.value.push({ id, message, type });
                    setTimeout(() => {
                        toasts.value = toasts.value.filter(t => t.id !== id);
                    }, 4000);
                };

                const checkAuth = async () => {
                    const token = localStorage.getItem('access_token');
                    if (token) {
                        try {
                            const res = await axios.get(`${API_BASE}/auth/me/`, { headers: getAuthHeaders() });
                            user.value = res.data;
                            isLoggedIn.value = true;
                            loadAllData();
                            return;
                        } catch (e) {}
                    }
                    handleLogout(false);
                };

                const handleLogin = async () => {
                    loginError.value = '';
                    if (!loginForm.username || !loginForm.password) {
                        loginError.value = 'Please enter username and password.';
                        return;
                    }
                    try {
                        const res = await axios.post(`${API_BASE}/auth/login/`, loginForm);
                        const data = res.data;
                        localStorage.setItem('access_token', data.access);
                        localStorage.setItem('refresh_token', data.refresh);
                        showToast(`Welcome back, ${data.user.username}!`, 'success');
                        checkAuth();
                    } catch (e) {
                        loginError.value = e.response?.data?.error || 'Login failed.';
                    }
                };

                const handleLogout = (notify = true) => {
                    localStorage.removeItem('access_token');
                    localStorage.removeItem('refresh_token');
                    isLoggedIn.value = false;
                    user.value = null;
                    if (notify) showToast('Logged out successfully.', 'info');
                };

                const loadAllData = async () => {
                    try {
                        const config = { headers: getAuthHeaders() };
                        const [tRes, clRes, crRes, coRes, reqRes, tsRes, schRes] = await Promise.all([
                            axios.get(`${API_BASE}/teachers/`, config),
                            axios.get(`${API_BASE}/school-classes/`, config),
                            axios.get(`${API_BASE}/classrooms/`, config),
                            axios.get(`${API_BASE}/courses/`, config),
                            axios.get(`${API_BASE}/course-requirements/`, config),
                            axios.get(`${API_BASE}/time-slots/`, config),
                            axios.get(`${API_BASE}/schedules/`, config)
                        ]);

                        state.teachers = tRes.data;
                        state.classes = clRes.data;
                        state.classrooms = crRes.data;
                        state.courses = coRes.data;
                        state.requirements = reqRes.data;
                        state.timeslots = tsRes.data;
                        state.schedules = schRes.data;

                        if (state.classes.length > 0 && !filterTargetClass.value) {
                            filterTargetClass.value = state.classes[0].name;
                        }
                    } catch (e) {
                        showToast('Error loading system data', 'error');
                    }
                };

                const fetchPost = async (endpoint, data, successMsg) => {
                    try {
                        await axios.post(`${API_BASE}/${endpoint}/`, data, {
                            headers: getAuthHeaders()
                        });
                        showToast(successMsg, 'success');
                        closeModal();
                        loadAllData();
                    } catch (e) {
                        const errMsg = e.response?.data?.error || 'Operation failed.';
                        showToast(errMsg, 'error');
                    }
                };

                const deleteItem = async (endpoint, id) => {
                    if (!confirm('Are you sure you want to delete this item?')) return;
                    try {
                        await axios.delete(`${API_BASE}/${endpoint}/${id}/`, {
                            headers: getAuthHeaders()
                        });
                        showToast('Item deleted.', 'success');
                        loadAllData();
                    } catch (e) {
                        showToast('Delete operation failed.', 'error');
                    }
                };

                const saveTeacher = () => {
                    if (!formTeacher.name) return showToast('Please enter teacher name.', 'error');
                    fetchPost('teachers', { ...formTeacher }, 'Teacher added successfully.');
                    formTeacher.name = '';
                };

                const saveClass = () => {
                    if (!formClass.name) return showToast('Class name is required.', 'error');
                    fetchPost('school-classes', { ...formClass }, 'Class added.');
                    formClass.name = '';
                };

                const saveClassroom = () => {
                    if (!formClassroom.name) return showToast('Room name is required.', 'error');
                    fetchPost('classrooms', { ...formClassroom }, 'Classroom added.');
                    formClassroom.name = '';
                    formClassroom.is_lab = false;
                };

                const saveCourse = () => {
                    if (!formCourse.name) return showToast('Course name is required.', 'error');
                    fetchPost('courses', { ...formCourse }, 'Course added.');
                    formCourse.name = '';
                    formCourse.is_lab_required = false;
                };

                const saveRequirement = () => {
                    if (!formReq.school_class || !formReq.course || !formReq.teacher || !formReq.weekly_hours) {
                        return showToast('Please complete all assignment fields.', 'error');
                    }
                    fetchPost('course-requirements', { ...formReq }, 'Course assignment created.');
                };

                const generateDefaultTimeSlots = async () => {
                    try {
                        const config = { headers: getAuthHeaders() };
                        for (let ts of state.timeslots) {
                            await axios.delete(`${API_BASE}/time-slots/${ts.id}/`, config);
                        }
                        for (let day of dayKeys) {
                            for (let hour = 1; hour <= 8; hour++) {
                                await axios.post(`${API_BASE}/time-slots/`, { day, hour }, config);
                            }
                        }
                        showToast('Generated 40 weekly time slots.', 'success');
                        loadAllData();
                    } catch (e) {
                        showToast('Failed to generate time slots.', 'error');
                    }
                };

                const generateSchedule = async () => {
                    showToast('Optimization engine running...', 'info');
                    try {
                        const res = await axios.post(`${API_BASE}/generate-schedule/`, {}, {
                            headers: getAuthHeaders()
                        });
                        showToast('Conflict-free schedule generated successfully!', 'success');
                        loadAllData();
                    } catch (e) {
                        const errMsg = e.response?.data?.error || 'Failed to generate schedule.';
                        showToast(errMsg, 'error');
                    }
                };

                const openModal = (modalName) => {
                    if (modalName === 'requirement') {
                        formReq.school_class = state.classes[0]?.id || '';
                        formReq.course = state.courses[0]?.id || '';
                        formReq.teacher = state.teachers[0]?.id || '';
                    }
                    activeModal.value = modalName;
                };

                const closeModal = () => { activeModal.value = null; };

                const getTimeSlotsForDay = (day) => {
                    return state.timeslots.filter(ts => ts.day === day).sort((a, b) => a.hour - b.hour);
                };

                const getScheduleSlot = (targetClass, day, hour) => {
                    return state.schedules.find(s => s.school_class_name === targetClass && s.day === day && s.hour === hour);
                };

                const scheduleStatsText = computed(() => {
                    if (state.schedules.length === 0) return 'No schedule generated yet';
                    return `Total ${state.schedules.length} Lesson Assignments Scheduled`;
                });

                const tabBtnClass = (tabName) => {
                    const base = 'flex-1 min-w-[140px] px-4 py-3 rounded-xl font-semibold text-sm transition-all flex items-center justify-center gap-2 ';
                    if (activeTab.value === tabName) {
                        return base + 'text-white bg-brand-600 shadow-md';
                    }
                    return base + 'text-slate-400 hover:text-white hover:bg-slate-800/50';
                };

                const printWindow = () => window.print();

                onMounted(() => {
                    checkAuth();
                });

                return {
                    isLoggedIn,
                    user,
                    activeTab,
                    activeModal,
                    filterTargetClass,
                    toasts,
                    loginForm,
                    loginError,
                    state,
                    formTeacher,
                    formClass,
                    formClassroom,
                    formCourse,
                    formReq,
                    dayKeys,
                    handleLogin,
                    handleLogout,
                    openModal,
                    closeModal,
                    saveTeacher,
                    saveClass,
                    saveClassroom,
                    saveCourse,
                    saveRequirement,
                    deleteItem,
                    generateDefaultTimeSlots,
                    generateSchedule,
                    getTimeSlotsForDay,
                    getScheduleSlot,
                    scheduleStatsText,
                    tabBtnClass,
                    printWindow
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
