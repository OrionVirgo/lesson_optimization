<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Scheduling & Optimization System (Vue 3)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#1e1b4b',
                        },
                        darkbg: '#0f172a',
                        darkcard: '#1e293b',
                        darkborder: '#334155'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        [v-cloak] { display: none !important; }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .gradient-text {
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 4px;
        }
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .glass-card { background: white !important; border: 1px solid #ccc !important; box-shadow: none !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

    <div id="app" v-cloak class="min-h-screen flex flex-col">

        <!-- Toasts -->
        <div class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm pointer-events-none">
            <div v-for="toast in toasts" :key="toast.id"
                 class="glass-card border p-4 rounded-xl shadow-xl flex items-center gap-3 text-sm font-semibold pointer-events-auto transition-all duration-300"
                 :class="{
                     'bg-emerald-900/90 border-emerald-500 text-emerald-200': toast.type === 'success',
                     'bg-rose-900/90 border-rose-500 text-rose-200': toast.type === 'error',
                     'bg-brand-900/90 border-brand-500 text-brand-200': toast.type === 'info'
                 }">
                <i class="fa-solid" :class="{
                    'fa-circle-check': toast.type === 'success',
                    'fa-circle-xmark': toast.type === 'error',
                    'fa-circle-info': toast.type === 'info'
                }"></i>
                <span>{{ toast.message }}</span>
            </div>
        </div>

        <!-- Authentication View -->
        <div v-if="!isLoggedIn" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 backdrop-blur-xl p-4">
            <div class="glass-card max-w-md w-full rounded-3xl p-8 border border-slate-800 shadow-2xl flex flex-col gap-6 relative overflow-hidden">
                <div class="absolute top-4 right-4">
                    <div class="flex items-center gap-1 bg-slate-900 border border-slate-800 p-1 rounded-xl">
                        <button @click="setLanguage('tr')" 
                                :class="currentLang === 'tr' ? 'bg-brand-600 text-white font-bold shadow-md' : 'text-slate-400 hover:text-slate-200'"
                                class="px-2.5 py-1 rounded-lg text-xs transition-all flex items-center gap-1">
                            <span>🇹🇷</span> <span>TR</span>
                        </button>
                        <button @click="setLanguage('en')" 
                                :class="currentLang === 'en' ? 'bg-brand-600 text-white font-bold shadow-md' : 'text-slate-400 hover:text-slate-200'"
                                class="px-2.5 py-1 rounded-lg text-xs transition-all flex items-center gap-1">
                            <span>🇬🇧</span> <span>EN</span>
                        </button>
                    </div>
                </div>
                <div class="text-center flex flex-col items-center gap-3">
                    <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-600 via-indigo-500 to-purple-500 flex items-center justify-center shadow-xl">
                        <i class="fa-solid fa-user-lock text-3xl text-white"></i>
                    </div>
                    <div>
                        <h2 class="font-display font-bold text-2xl text-white tracking-tight">{{ t('user_auth') }}</h2>
                        <p class="text-xs text-slate-400 mt-1">{{ t('app_title') }} {{ t('app_title_highlight') }}</p>
                    </div>
                </div>

                <form @submit.prevent="handleLogin" class="flex flex-col gap-4">
                    <div v-if="loginError" class="p-3 rounded-xl bg-rose-950/80 border border-rose-500/50 text-rose-300 text-xs font-semibold flex items-center gap-2">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span>{{ loginError }}</span>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">{{ t('username') }}</label>
                        <input v-model="loginForm.username" type="text" required :placeholder="t('enter_username')" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl py-3 px-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 font-medium">
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">{{ t('password') }}</label>
                        <input v-model="loginForm.password" type="password" required :placeholder="t('enter_password')" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl py-3 px-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 font-medium">
                    </div>

                    <button type="submit" class="mt-2 w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-brand-600 to-purple-600 hover:from-brand-500 hover:to-purple-500 text-white font-bold text-sm shadow-lg">
                        <span>{{ t('login') }}</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- Main Workspace -->
        <template v-else>
            <header class="no-print sticky top-0 z-40 glass-card border-b border-slate-800 bg-slate-950/80 backdrop-blur-md">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-brand-600 via-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-brand-500/30">
                            <i class="fa-solid fa-calendar-days text-2xl text-white"></i>
                        </div>
                        <div>
                            <h1 class="font-display font-bold text-xl tracking-tight text-white flex items-center gap-2">
                                {{ t('app_title') }} <span class="gradient-text font-extrabold">{{ t('app_title_highlight') }}</span>
                            </h1>
                            <p class="text-xs text-slate-400 font-medium">{{ t('app_subtitle') }}</p>
                        </div>
                    </div>

                    <div class="flex items-center gap-3">
                        <!-- Vue 3 Language Selector -->
                        <div class="flex items-center gap-1 bg-slate-900 border border-slate-800 p-1 rounded-xl">
                            <button @click="setLanguage('tr')" 
                                    :class="currentLang === 'tr' ? 'bg-brand-600 text-white font-bold shadow-md' : 'text-slate-400 hover:text-slate-200'"
                                    class="px-2.5 py-1 rounded-lg text-xs transition-all flex items-center gap-1">
                                <span>🇹🇷</span> <span>TR</span>
                            </button>
                            <button @click="setLanguage('en')" 
                                    :class="currentLang === 'en' ? 'bg-brand-600 text-white font-bold shadow-md' : 'text-slate-400 hover:text-slate-200'"
                                    class="px-2.5 py-1 rounded-lg text-xs transition-all flex items-center gap-1">
                                <span>🇬🇧</span> <span>EN</span>
                            </button>
                        </div>

                        <div v-if="user" class="hidden sm:flex items-center gap-2 px-3.5 py-2 rounded-xl bg-slate-900/90 border border-slate-800 text-slate-300 text-xs font-medium">
                            <i class="fa-solid fa-circle-user text-brand-400 text-sm"></i>
                            <span>{{ t('welcome') }} <strong class="text-white font-semibold">{{ user.username }}</strong></span>
                        </div>
                        <button @click="generateSchedule" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-brand-600 to-purple-600 hover:from-brand-500 hover:to-purple-500 text-white text-sm font-bold shadow-lg shadow-brand-500/25 hover:shadow-brand-500/40 transition-all flex items-center gap-2 transform active:scale-95">
                            <i class="fa-solid fa-bolt"></i>
                            <span>{{ t('generate_schedule') }}</span>
                        </button>
                        <button @click="printWindow" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 transition-all" :title="t('print_timetable')">
                            <i class="fa-solid fa-print"></i>
                        </button>
                        <button @click="handleLogout" class="p-2.5 px-3.5 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/30 transition-all flex items-center gap-1.5 text-xs font-semibold" :title="t('log_out')">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            <span class="hidden md:inline">{{ t('log_out') }}</span>
                        </button>
                    </div>
                </div>
            </header>

            <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col gap-8">
                <!-- Navigation Tabs -->
                <div class="no-print glass-card p-1.5 rounded-2xl flex flex-wrap gap-1 border border-slate-800 bg-slate-900/60">
                    <button @click="activeTab = 'timetable'" :class="tabBtnClass('timetable')">
                        <i class="fa-solid fa-calendar-week"></i>
                        <span>{{ t('tab_timetable') }}</span>
                    </button>
                    <button @click="activeTab = 'teachers'" :class="tabBtnClass('teachers')">
                        <i class="fa-solid fa-chalkboard-user"></i>
                        <span>{{ t('tab_teachers') }}</span>
                    </button>
                    <button @click="activeTab = 'classes'" :class="tabBtnClass('classes')">
                        <i class="fa-solid fa-school"></i>
                        <span>{{ t('tab_classes') }}</span>
                    </button>
                    <button @click="activeTab = 'courses'" :class="tabBtnClass('courses')">
                        <i class="fa-solid fa-book-open"></i>
                        <span>{{ t('tab_courses') }}</span>
                    </button>
                    <button @click="activeTab = 'timeslots'" :class="tabBtnClass('timeslots')">
                        <i class="fa-solid fa-clock"></i>
                        <span>{{ t('tab_timeslots') }}</span>
                    </button>
                </div>

                <!-- Tab 1: Timetable Matrix -->
                <section v-show="activeTab === 'timetable'" class="flex flex-col gap-6">
                    <div class="no-print glass-card p-4 rounded-2xl flex flex-wrap items-center justify-between gap-4 border border-slate-800">
                        <div class="flex items-center gap-3 flex-wrap">
                            <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Select Class:</span>
                            <select v-model="filterTargetClass" class="bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-xl px-4 py-2 focus:ring-2 focus:ring-brand-500 focus:outline-none font-semibold">
                                <option v-for="c in state.classes" :key="c.id" :value="c.name">{{ c.name }}</option>
                            </select>
                        </div>
                        <div class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-brand-500/10 text-brand-400 border border-brand-500/20 flex items-center gap-2">
                            <i class="fa-solid fa-circle-info"></i>
                            <span>{{ scheduleStatsText }}</span>
                        </div>
                    </div>

                    <div class="glass-card rounded-2xl p-6 border border-slate-800 shadow-2xl overflow-hidden printable-grid">
                        <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-4">
                            <div>
                                <h2 class="text-xl font-display font-bold text-white flex items-center gap-2">
                                    <i class="fa-solid fa-table-cells text-brand-400"></i>
                                    <span>Weekly Schedule Matrix</span>
                                    <span v-if="filterTargetClass" class="text-brand-400 font-extrabold">({{ filterTargetClass }})</span>
                                </h2>
                                <p class="text-xs text-slate-400">Monday - Friday Weekly Overview</p>
                            </div>
                            <div class="flex items-center gap-4 text-xs">
                                <span class="flex items-center gap-1.5 text-slate-300">
                                    <span class="w-3 h-3 rounded-full bg-brand-500 inline-block"></span> Lecture
                                </span>
                                <span class="flex items-center gap-1.5 text-slate-300">
                                    <span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span> Laboratory
                                </span>
                            </div>
                        </div>

                        <div class="overflow-x-auto custom-scrollbar">
                            <table class="w-full border-collapse min-w-[700px] text-center">
                                <thead>
                                    <tr class="bg-slate-900/90 text-slate-300 text-sm font-bold border-b border-slate-800">
                                        <th class="py-3 px-4 w-20 border-r border-slate-800">Hour</th>
                                        <th v-for="day in dayKeys" :key="day" class="py-3 px-4 w-1/5 border-r border-slate-800">{{ day }}</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800/60 text-sm">
                                    <tr v-for="h in 8" :key="h" class="hover:bg-slate-900/40 transition-colors">
                                        <td class="py-4 px-3 font-semibold text-slate-400 bg-slate-950/40 border-r border-slate-800">Hour {{ h }}</td>
                                        <td v-for="day in dayKeys" :key="day" class="p-2 border-r border-slate-800/80 align-top">
                                            <div v-if="getScheduleSlot(filterTargetClass, day, h)"
                                                 class="p-3 rounded-xl border flex flex-col gap-1 shadow-md text-left transition-all duration-200 hover:scale-[1.02]"
                                                 :class="getScheduleSlot(filterTargetClass, day, h).is_lab ? 'bg-amber-950/40 border-amber-500/40 text-amber-200' : 'bg-brand-950/40 border-brand-500/40 text-brand-200'">
                                                <div class="font-bold text-sm tracking-wide flex items-center justify-between">
                                                    <span>{{ getScheduleSlot(filterTargetClass, day, h).course_name }}</span>
                                                    <i class="fa-solid text-xs" :class="getScheduleSlot(filterTargetClass, day, h).is_lab ? 'fa-flask text-amber-400' : 'fa-book text-brand-400'"></i>
                                                </div>
                                                <div class="text-xs opacity-90 flex items-center gap-1 mt-0.5">
                                                    <i class="fa-solid fa-chalkboard-user"></i>
                                                    <span>{{ getScheduleSlot(filterTargetClass, day, h).teacher_name }}</span>
                                                </div>
                                                <div class="text-[11px] opacity-75 flex items-center gap-1">
                                                    <i class="fa-solid fa-door-open"></i>
                                                    <span>{{ getScheduleSlot(filterTargetClass, day, h).classroom_name }}</span>
                                                </div>
                                            </div>
                                            <div v-else class="h-16 rounded-xl border border-dashed border-slate-800/80 flex items-center justify-center text-slate-600 text-xs font-medium">
                                                <span>Empty</span>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <!-- Tab 2: Teachers -->
                <section v-show="activeTab === 'teachers'" class="flex flex-col gap-6">
                    <div class="flex justify-between items-center">
                        <div>
                            <h2 class="text-2xl font-display font-bold text-white">Teacher Management</h2>
                            <p class="text-sm text-slate-400">Manage teaching staff and weekly off-days</p>
                        </div>
                        <button @click="openModal('teacher')" class="px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-semibold text-sm transition-all flex items-center gap-2 shadow-lg shadow-brand-500/20">
                            <i class="fa-solid fa-plus"></i>
                            <span>Add New Teacher</span>
                        </button>
                    </div>

                    <div class="glass-card rounded-2xl overflow-hidden border border-slate-800">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-slate-900/80 text-xs uppercase font-bold text-slate-400 border-b border-slate-800">
                                <tr>
                                    <th class="py-3.5 px-6">ID</th>
                                    <th class="py-3.5 px-6">Teacher Name</th>
                                    <th class="py-3.5 px-6">Branch</th>
                                    <th class="py-3.5 px-6">Off-Day</th>
                                    <th class="py-3.5 px-6 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800 text-sm text-slate-300">
                                <tr v-if="state.teachers.length === 0">
                                    <td colspan="5" class="py-8 text-center text-slate-500 italic">No teachers added yet.</td>
                                </tr>
                                <tr v-for="(teacher, index) in state.teachers" :key="teacher.id" class="hover:bg-slate-800/30 transition-colors">
                                    <td class="py-3.5 px-6 font-mono text-xs text-slate-500">#{{ index + 1 }}</td>
                                    <td class="py-3.5 px-6 font-semibold text-white flex items-center gap-2">
                                        <i class="fa-solid fa-user text-brand-400"></i>
                                        <span>{{ teacher.name }}</span>
                                    </td>
                                    <td class="py-3.5 px-6">
                                        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-brand-500/10 text-brand-300 border border-brand-500/20">
                                            {{ teacher.branch || 'General' }}
                                        </span>
                                    </td>
                                    <td class="py-3.5 px-6">
                                        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/10 text-indigo-300 border border-indigo-500/20">
                                            {{ teacher.off_day }}
                                        </span>
                                    </td>
                                    <td class="py-3.5 px-6 text-right">
                                        <div class="flex items-center justify-end gap-2">
                                            <button @click="editTeacher(teacher)" class="px-3 py-1.5 rounded-lg bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/20 text-xs font-semibold transition-all flex items-center gap-1.5">
                                                <i class="fa-solid fa-pen-to-square"></i>
                                                <span>Edit</span>
                                            </button>
                                            <button @click="confirmDelete('teachers', teacher.id, teacher.name)" class="px-3 py-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/20 text-xs font-semibold transition-all flex items-center gap-1.5">
                                                <i class="fa-solid fa-trash-can"></i>
                                                <span>Delete</span>
                                            </button>
                                        </div>
                                    </td>
                                </tr>

                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- Tab 3: Classes & Classrooms -->
                <section v-show="activeTab === 'classes'" class="flex flex-col gap-8">
                    <div class="flex flex-col gap-4">
                        <div class="flex justify-between items-center">
                            <div>
                                <h2 class="text-xl font-display font-bold text-white">Classes</h2>
                                <p class="text-xs text-slate-400">Active student classes (e.g. Grade 9-A)</p>
                            </div>
                            <button @click="openModal('class')" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-sm font-semibold transition-all flex items-center gap-2">
                                <i class="fa-solid fa-plus"></i>
                                <span>Add Class</span>
                            </button>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                            <div v-if="state.classes.length === 0" class="col-span-full py-8 text-center text-slate-500 italic border border-dashed border-slate-800 rounded-2xl">
                                No student classes defined.
                            </div>
                            <div v-for="c in state.classes" :key="c.id" class="glass-card p-4 rounded-2xl border border-slate-800 flex items-center justify-between shadow-lg">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-brand-500/20 text-brand-400 flex items-center justify-center font-bold">
                                        <i class="fa-solid fa-users"></i>
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-white text-base">{{ c.name }}</h4>
                                        <p class="text-[11px] text-slate-400">Student Class</p>
                                    </div>
                                </div>
                                <button @click="deleteItem('school-classes', c.id)" class="p-2 rounded-lg text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 transition-all">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col gap-4">
                        <div class="flex justify-between items-center">
                            <div>
                                <h2 class="text-xl font-display font-bold text-white">Classrooms & Laboratories</h2>
                                <p class="text-xs text-slate-400">Physical rooms and laboratory facilities</p>
                            </div>
                            <button @click="openModal('classroom')" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-sm font-semibold transition-all flex items-center gap-2">
                                <i class="fa-solid fa-plus"></i>
                                <span>Add Classroom</span>
                            </button>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                            <div v-if="state.classrooms.length === 0" class="col-span-full py-8 text-center text-slate-500 italic border border-dashed border-slate-800 rounded-2xl">
                                No rooms or laboratories added.
                            </div>
                            <div v-for="cr in state.classrooms" :key="cr.id" class="glass-card p-4 rounded-2xl border border-slate-800 flex items-center justify-between shadow-lg">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl flex items-center justify-center font-bold"
                                         :class="cr.is_lab ? 'bg-amber-500/20 text-amber-400' : 'bg-indigo-500/20 text-indigo-400'">
                                        <i class="fa-solid" :class="cr.is_lab ? 'fa-flask' : 'fa-door-open'"></i>
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-white text-base">{{ cr.name }}</h4>
                                        <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md"
                                              :class="cr.is_lab ? 'bg-amber-500/10 text-amber-300 border border-amber-500/20' : 'bg-slate-800 text-slate-400'">

                        toasts.value = toasts.value.filter(t => t.id !== id);
                    }, 4000);

                const checkAuth = async () => {
                    const token = localStorage.getItem('access_token');
                    if (token) {
                        try {
                            const res = await axios.get(`${API_BASE}/auth/me/`, { headers: getAuthHeaders() });
                            user.value = res.data;
                            isLoggedIn.value = true;
                            loadAllData();
                            return;
                        } catch (e) {}
                    }
                    handleLogout(false);
                };

                const handleLogin = async () => {
                    loginError.value = '';
                    if (!loginForm.username || !loginForm.password) {
                        loginError.value = 'Please enter username and password.';
                        return;
                    }
                    try {
                        const res = await axios.post(`${API_BASE}/auth/login/`, loginForm);
                        const data = res.data;
                        localStorage.setItem('access_token', data.access);
                        localStorage.setItem('refresh_token', data.refresh);
                        showToast(`Welcome back, ${data.user.username}!`, 'success');
                        checkAuth();
                    } catch (e) {
                        loginError.value = e.response?.data?.error || 'Login failed.';
                    }
                };

                const handleLogout = (notify = true) => {
                    localStorage.removeItem('access_token');
                    localStorage.removeItem('refresh_token');
                    isLoggedIn.value = false;
                    user.value = null;
                    if (notify) showToast('Logged out successfully.', 'info');
                };

                    try {

                            axios.get(`${API_BASE}/school-classes/`, config),
                            axios.get(`${API_BASE}/classrooms/`, config),
                            axios.get(`${API_BASE}/courses/`, config),
                            axios.get(`${API_BASE}/course-requirements/`, config),
                            axios.get(`${API_BASE}/time-slots/`, config),
                            axios.get(`${API_BASE}/schedules/`, config)
                        ]);

                        state.teachers = tRes.data;
                        state.classes = clRes.data;
                        state.classrooms = crRes.data;
                        state.courses = coRes.data;
                        state.requirements = reqRes.data;
                        state.timeslots = tsRes.data;
                        state.schedules = schRes.data;

                        if (state.classes.length > 0 && !filterTargetClass.value) {
                            filterTargetClass.value = state.classes[0].name;
                        }
                    } catch (e) {
                        showToast('Error loading system data', 'error');
                    }
                };

                const parseError = (e) => {
                    if (!e.response?.data) return 'Network or server error occurred.';
                    const data = e.response.data;
                    if (typeof data === 'string') return data;
                    if (data.error) return data.error;
                    if (typeof data === 'object') {
                        const keys = Object.keys(data);
                        if (keys.length > 0) {
                            const field = keys[0];
                            const msg = Array.isArray(data[field]) ? data[field].join(', ') : data[field];
                            return `${field}: ${msg}`;
                        }
                    }
                    return 'Operation failed.';
                };

                    try {
                        await axios.post(`${API_BASE}/${endpoint}/`, data, {

                        closeModal();
                        loadAllData();

                        resetCourseForm();
                    }
                    if (modalName === 'requirement') {
                        isEditReq.value = false;
                        editingReqId.value = null;
                        formReq.school_class = state.classes[0]?.id || '';
                        formReq.course = state.courses[0]?.id || '';
                        formReq.teacher = state.teachers[0]?.id || '';
                        formReq.weekly_hours = 2;
                    }
                    activeModal.value = modalName;
                };

                const closeModal = () => { activeModal.value = null; };

                const getTimeSlotsForDay = (day) => {
                    return state.timeslots.filter(ts => ts.day === day).sort((a, b) => a.hour - b.hour);
                };

                const getScheduleSlot = (targetClass, day, hour) => {
                    return state.schedules.find(s => s.school_class_name === targetClass && s.day === day && s.hour === hour);
                };

                const scheduleStatsText = computed(() => {
                    if (state.schedules.length === 0) return 'No schedule generated yet';
                    return `Total ${state.schedules.length} Lesson Assignments Scheduled`;
                });

                const tabBtnClass = (tabName) => {
                    const base = 'flex-1 min-w-[140px] px-4 py-3 rounded-xl font-semibold text-sm transition-all flex items-center justify-center gap-2 ';
                    if (activeTab.value === tabName) {
                        return base + 'text-white bg-brand-600 shadow-md';
                    }
                    return base + 'text-slate-400 hover:text-white hover:bg-slate-800/50';
                };

                const printWindow = () => window.print();

                onMounted(() => {
                    checkAuth();
                });

                return {
                    isLoggedIn,
                    user,
                    activeTab,
                    activeModal,
                    filterTargetClass,
                    toasts,
                    loginForm,
                    loginError,
                    state,
                    formTeacher,
                    isEditTeacher,
                    editTeacher,
                    formClass,
                    isEditClass,
                    editClass,
                    formClassroom,
                    isEditClassroom,
                    editClassroom,
                    formCourse,
                    isEditCourse,
                    editCourse,
                    formReq,
                    isEditReq,
                    editRequirement,
                    dayKeys,
                    handleLogin,
                    handleLogout,
                    openModal,
                    closeModal,
                    saveTeacher,
                    saveClass,
                    saveClassroom,
                    saveCourse,
                    saveRequirement,
                    showDeleteModal,
                    deleteTarget,
                    handleConfirmDelete,
                    confirmDelete,
                    deleteItem,
                    generateDefaultTimeSlots,
                    generateSchedule,
                    getTimeSlotsForDay,
                    getScheduleSlot,
                    scheduleStatsText,
                    tabBtnClass,
                    printWindow,
                    currentLang,
                    setLanguage,
                    t
                };
            }
        });
        app.mount('#app');
    </script>
</body>
</html>
